name: Bootstrap New Cloudflare Service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-new-cloudflare-service
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Fail closed on missing permission bootstrap
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CF_API_TOKEN missing'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'CF_ACCOUNT_ID missing'; exit 1; }
          python3 tools/validate_project_boundary.py
          python3 tools/service_contract_guard.py
      - name: Resolve or create NEW project D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database")
          D1_ID=$(echo "$LIST" | jq -r '.result[] | select(.name=="van-hanh-dc-hung-yen") | .uuid' | head -n1)
          if [ -z "$D1_ID" ]; then
            CREATED=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database" --data '{"name":"van-hanh-dc-hung-yen"}')
            D1_ID=$(echo "$CREATED" | jq -r '.result.uuid')
          fi
          test -n "$D1_ID" && test "$D1_ID" != "null"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"
      - name: Render binding and migrate
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python3 tools/render_wrangler.py
          npx wrangler d1 migrations apply van-hanh-dc-hung-yen --remote --config wrangler.generated.jsonc
      - name: Deploy isolated Worker + Durable Object
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python3 tools/render_wrangler.py
          npx wrangler deploy --config wrangler.generated.jsonc
      - name: Receipt
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          printf 'project_id=VAN_HANH_DC_HUNG_YEN\nd1_database_name=van-hanh-dc-hung-yen\nd1_database_id=%s\nworker=van-hanh-dc-hung-yen-service\n' "$D1_DATABASE_ID" > cloudflare-bootstrap-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bootstrap-receipt
          path: cloudflare-bootstrap-receipt.txt
          retention-days: 30
